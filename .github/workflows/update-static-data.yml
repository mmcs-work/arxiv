name: Update static archive data

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to refresh"
        default: "7"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python static_data/build.py --recent --days "${{ inputs.days || '7' }}"
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/data
          git diff --cached --quiet || git commit -m "Update static archive data"
          git push

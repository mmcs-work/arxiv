name: Update public dataset

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to refresh (an overlap protects against late arXiv indexing)"
        default: "2"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r dataset/requirements.txt
      - run: python dataset/publish.py --recent --days "${{ inputs.days || '2' }}" --output dataset/fast-build --prefix updates --upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}

name: Fetch papers

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to look back"
        default: "2"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python fetch.py --days "${{ inputs.days || '2' }}"
      - name: Save new papers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.db
          git diff --cached --quiet || git commit -m "Update papers"
          git push


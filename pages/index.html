<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One Author / arXiv CS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="alternate" type="application/rss+xml" title="One Author — latest papers" href="feed.xml">
  </head>
  <body>
    <main>
      <header>
        <div class="header-top">
          <p class="eyebrow">a quiet arXiv archive</p>
          <nav class="header-links" aria-label="Archive links">
            <a class="github-link" href="https://github.com/mmcs-work/arxiv" aria-label="View the code on GitHub">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.49c-2.23.49-2.7-.95-2.7-.95-.36-.93-.89-1.18-.89-1.18-.73-.5.06-.49.06-.49.81.06 1.23.83 1.23.83.72 1.23 1.89.87 2.35.66.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.96 0-.88.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.12 0 0 .68-.22 2.2.82A7.65 7.65 0 0 1 8 3.8a7.7 7.7 0 0 1 2.01.27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.52.56.83 1.27.83 2.15 0 3.08-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.21c0 .21.14.46.55.38A8 8 0 0 0 8 0Z"/></svg>
              <span>Code</span>
            </a>
            <button class="rss-link" id="rss-toggle" type="button" aria-controls="rss-panel" aria-label="Choose an RSS feed">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.18 17.82a2.18 2.18 0 1 1 0 4.36 2.18 2.18 0 0 1 0-4.36ZM3 3.5v3.17c7.91 0 14.33 6.42 14.33 14.33h3.17C20.5 11.34 12.66 3.5 3 3.5Zm0 6.34v3.17A7.99 7.99 0 0 1 10.99 21h3.17C14.16 14.84 9.16 9.84 3 9.84Z"/></svg>
              <span>RSS</span>
            </button>
          </nav>
        </div>
        <h1>One Author</h1>
        <p class="lede">Computer Science papers written by one person.</p>
      </header>
      <form id="filters">
        <label>Search <input name="query" type="search" placeholder="title or author"></label>
        <label>Topic <select name="category"><option value="">All CS topics</option></select></label>
        <label>From <input name="start" type="date"></label>
        <label>To <input name="end" type="date"></label>
        <button>Explore</button>
      </form>
      <details class="rss-panel" id="rss-panel">
        <summary><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.18 17.82a2.18 2.18 0 1 1 0 4.36 2.18 2.18 0 0 1 0-4.36ZM3 3.5v3.17c7.91 0 14.33 6.42 14.33 14.33h3.17C20.5 11.34 12.66 3.5 3 3.5Zm0 6.34v3.17A7.99 7.99 0 0 1 10.99 21h3.17C14.16 14.84 9.16 9.84 3 9.84Z"/></svg> Follow by RSS</summary>
        <p>Add the latest feed, or choose a topic to open its individual feed in your RSS reader.</p>
        <div class="rss-controls">
          <select id="rss-category" aria-label="Choose an RSS topic"><option value="">Latest papers</option></select>
          <a id="rss-open" href="feed.xml">Open feed</a>
          <button id="rss-copy" type="button">Copy link</button>
        </div>
      </details>
      <p id="status" role="status">Connecting to the archive…</p>
      <section id="papers" aria-live="polite"></section>
      <nav id="pagination" aria-label="Paper pages" hidden>
        <button id="previous" type="button">Previous</button>
        <span id="page-number"></span>
        <button id="next" type="button">Next</button>
      </nav>
      <footer>Metadata from <a href="https://arxiv.org">arXiv</a>. <a href="feed.xml">RSS</a>. Full text remains with arXiv.</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
